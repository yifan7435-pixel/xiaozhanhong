<!doctype html><html lang="zh"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FuckXiaoBaiHong 用户中心</title>
<style>
*{box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px;width:min(360px,92vw)}
h1{font-size:18px;margin:0 0 2px} h1 small{color:#64748b;font-weight:400;font-size:12px}
p{margin:6px 0;color:#94a3b8;font-size:12px}
input{width:100%;padding:8px 9px;margin:6px 0;border-radius:7px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:14px}
button{width:100%;padding:9px;border:0;border-radius:7px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
button.ghost{background:#334155;margin-top:6px}
.key{font:16px Consolas,monospace;letter-spacing:1px;color:#22d3ee;word-break:break-all;background:#0f172a;border:1px solid #334155;border-radius:7px;padding:8px;margin:6px 0;cursor:pointer;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
#st{color:#fbbf24;font-size:12px;min-height:16px;margin-top:6px}.ok{color:#4ade80}.hidden{display:none}
a.link{color:#93c5fd;font-size:12px;display:inline-block;margin-top:4px;cursor:pointer;text-decoration:none}
</style>
<div class="card">
  <h1>FuckXiaoBaiHong <small>用户中心</small></h1>
  <div id="login">
    <input id="email" type="email" placeholder="邮箱" autocomplete="email">
    <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="doAuth('login')" id="btn1">登录</button>
    <a class="link" onclick="toggleMode()" id="modeLink">没有账号？点此注册</a>
    <div id="st"></div>
  </div>
  <div id="panel" class="hidden">
    <div id="st2" class="ok"></div>
    <div class="row"><span>状态</span><b id="vip"></b></div>
    <div class="row"><span>到期</span><b id="exp"></b></div>
    <div class="row"><span>已绑机器</span><b id="mach"></b></div>
    <div id="keyWrap" class="hidden"><p>我的授权密钥（点击复制）：</p><div class="key" onclick="copyKey()" id="key"></div></div>
    <button id="payBtn" class="hidden" onclick="payIntent()">已付款，申请开通</button>
    <button class="ghost" onclick="logout()">退出</button>
    <p>密钥在软件里粘贴激活；一台机，换机先解绑。</p>
  </div>
</div>
<script>
const SUP="https://obtkpflonqsexxwtybal.supabase.co";
const API="https://auth.matsci.top/api/v1/center";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9idGtwZmxvbnFzZXh4d3R5YmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzU0ODksImV4cCI6MjEwNDI1MTQ4OX0.f0eWx65W_S9605WO8fVk_xH_ymvcGPsqqWvFZwJHawQ";
let TOKEN=localStorage.getItem("fxbh_tok")||"", mode="login";
async function jr(u,o){try{const r=await fetch(u,o);return[true,r,await r.json()]}catch(e){return[false,null,{msg:String(e)}]}}
function st(el,t,cls){el.textContent=t;el.className=cls||""}
async function doAuth(){
  const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;
  const box=document.getElementById('st');
  if(!email||!pass){st(box,'请填邮箱和密码');return}
  st(box,'处理中…');document.getElementById('btn1').disabled=true;
  const u=(mode==='login'?SUP+'/auth/v1/token?grant_type=password':SUP+'/auth/v1/signup');
  const[ok,r,j]=await jr(u,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  document.getElementById('btn1').disabled=false;
  if(!ok||!r.ok){st(box,'失败：'+(j.msg||j.error_description||j.message||'网络错误'));return}
  if(mode==='signup'){if(j.user&&j.user.email_confirmed_at===null){st(box,'注册成功，去邮箱点确认链接后再登录');document.getElementById('pass').value='';return}}
  TOKEN=j.access_token;localStorage.setItem('fxbh_tok',TOKEN);show();
}
function hdr(){return{apikey:ANON,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}}
function toggleMode(){mode=mode==='login'?'signup':'login';document.getElementById('modeLink').textContent=mode==='login'?'没有账号？点此注册':'已有账号？去登录';document.getElementById('btn1').textContent=mode==='login'?'登录':'注册'}
async function show(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  const[ok,r,j]=await jr(API+'/status',{method:'POST',headers:hdr(),body:JSON.stringify({jwt:TOKEN})});
  const box=document.getElementById('st2');
  if(!ok||!r.ok){st(box,'状态获取失败：'+(j.detail&&j.detail.detail||j.detail||'网络错误'));return}
  st(box, j.is_vip?'已开通':'待开通', j.is_vip?'ok':'');
  document.getElementById('vip').textContent=j.is_vip?'VIP ✅':'非 VIP';
  document.getElementById('vip').style.color=j.is_vip?'#4ade80':'#f87171';
  document.getElementById('exp').textContent=j.plan_expire_at?new Date(j.plan_expire_at*1000).toLocaleDateString():'永久';
  document.getElementById('mach').textContent=j.machines+' 台';
  const kw=document.getElementById('keyWrap'),pb=document.getElementById('payBtn');
  if(j.is_vip&&j.key){kw.classList.remove('hidden');document.getElementById('key').textContent=j.key;pb.classList.add('hidden');st(box,'已开通：换机请先在软件解绑旧机','ok')}
  else{kw.classList.add('hidden');pb.classList.remove('hidden')}
}
async function payIntent(){const b=document.getElementById('st2');st(b,'已登记，请联系卖家确认付款…');const[ok,r]=await jr(API+'/pay-intent',{method:'POST',headers:hdr(),body:JSON.stringify({jwt:TOKEN})});st(b,ok&&r.ok?'已提交开通申请，卖家确认后密钥会显示在此':'提交失败，请重试',ok&&r.ok?'ok':'')}
function copyKey(){navigator.clipboard.writeText(document.getElementById('key').textContent);const b=document.getElementById('st2');st(b,'密钥已复制，去软件粘贴激活','ok')}
function logout(){TOKEN='';localStorage.removeItem('fxbh_tok');location.reload()}
if(TOKEN)show();
</script>
