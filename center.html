<!doctype html><html lang="zh"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FuckXiaoBaiHong 用户中心</title>
<style>
*{box-sizing:border-box}
body{font-family:'Manrope','Noto Sans SC','Microsoft YaHei',sans-serif;background:#0a0b0e;color:#f1f3ef;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px}
.card{background:#12151a;border:1px solid #617d35;border-radius:16px;padding:26px;width:min(380px,92vw);box-shadow:0 30px 100px #0008;position:relative}
h1{font-size:19px;letter-spacing:-.04em;margin:0 0 2px} h1 small{color:#9299a2;font-weight:400;font-size:12px;font-family:'DM Mono',monospace}
p{margin:6px 0;color:#9299a2;font-size:12px;line-height:1.7}
input{width:100%;padding:9px 11px;margin:6px 0;border-radius:8px;border:1px solid #292e36;background:#0a0b0e;color:#f1f3ef;font-size:14px;outline:0}
input:focus{border-color:#c7f36a}
button{width:100%;padding:10px;border:0;border-radius:8px;cursor:pointer;font:inherit;font-weight:700}
button.primary{background:#c7f36a;color:#10130b}
button.primary:hover{background:#e0ff8c}
button.ghost{background:transparent;border:1px solid #292e36;color:#f1f3ef;margin-top:6px}
button.ghost:hover{border-color:#9299a2}
.key{font:15px 'DM Mono',Consolas,monospace;letter-spacing:1px;color:#c7f36a;word-break:break-all;background:#0a0b0e;border:1px solid #617d35;border-radius:8px;padding:9px;margin:6px 0;cursor:pointer;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;margin:5px 0;font-size:13px}
#st{color:#c7f36a;font-size:12px;min-height:16px;margin-top:6px}.ok{color:#c7f36a}.hidden{display:none}
a.link{color:#c7f36a;font-size:12px;display:inline-block;margin-top:6px;cursor:pointer;text-decoration:none}
hr{border:0;border-top:1px solid #292e36;margin:12px 0}
#adm select,#adm input{background:#0a0b0e;border:1px solid #292e36;color:#f1f3ef;border-radius:6px;padding:5px;font-size:12px}
#adm .urow{border:1px solid #292e36;border-radius:8px;padding:8px;margin:6px 0;font-size:12px}
#adm button{width:auto;padding:4px 9px;font-size:12px;font-weight:400;border-radius:6px;border:1px solid #292e36;background:transparent;color:#f1f3ef}
</style>
<div class="card">
  <h1>FuckXiaoBaiHong <small>用户中心</small></h1>
  <div id="login">
    <input id="email" type="email" placeholder="邮箱" autocomplete="email">
    <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="doAuth('login')" id="btn1">登录</button>
    <a class="link" onclick="toggleMode()" id="modeLink">没有账号？点此注册</a>
    <div id="st"></div>
  </div>
  <div id="panel" class="hidden">
    <div id="st2" class="ok"></div>
    <div class="row"><span>状态</span><b id="vip"></b></div>
    <div class="row"><span>到期</span><b id="exp"></b></div>
    <div class="row"><span>已绑机器</span><b id="mach"></b></div>
    <div id="keyWrap" class="hidden"><p>我的授权密钥（点击复制）：</p><div class="key" onclick="copyKey()" id="key"></div></div>
    <button id="payBtn" class="hidden" onclick="payIntent()">已付款，申请开通</button>
    <button class="ghost" onclick="logout()">退出</button>
    <p>密钥在软件里粘贴激活；一台机，换机先解绑。</p>
    <hr style="border-color:#292e36;margin:12px 0">
    <button class="ghost hidden" id="admBtn" onclick="toggleAdm()">管理买家</button>
    <div id="adm" class="hidden"><div id="admList"></div><p>角色=user/vip/admin；admin 默认即 VIP。保存角色即生效，降级会自动吊销密钥。</p></div>
  </div>
</div>
<script>
const SUP="https://obtkpflonqsexxwtybal.supabase.co";
const API="https://auth.matsci.top/api/v1/center";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9idGtwZmxvbnFzZXh4d3R5YmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzU0ODksImV4cCI6MjEwNDI1MTQ4OX0.f0eWx65W_S9605WO8fVk_xH_ymvcGPsqqWvFZwJHawQ";
let TOKEN=localStorage.getItem("fxbh_tok")||"", mode="login";
async function jr(u,o){const c=new AbortController();const t=setTimeout(()=>c.abort(),20000);o.signal=c.signal;try{const r=await fetch(u,o);clearTimeout(t);let j;try{j=await r.json()}catch(e){j={}}return[true,r,j]}catch(e){clearTimeout(t);return[false,null,{msg:e&&e.name==='AbortError'?'请求超时(网络慢/被拦)':'网络错误: '+e}]}}
function st(el,t,cls){el.textContent=t;el.className=cls||""}
async function doAuth(){
  const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;
  const box=document.getElementById('st');
  if(!email||!pass){st(box,'请填邮箱和密码');return}
  st(box,'处理中…');document.getElementById('btn1').disabled=true;
  const u=(mode==='login'?SUP+'/auth/v1/token?grant_type=password':SUP+'/auth/v1/signup');
  const[ok,r,j]=await jr(u,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  document.getElementById('btn1').disabled=false;
  if(!ok||!r.ok){st(box,'失败：'+(j.msg||j.error_description||j.message||'网络错误'));return}
  if(mode==='signup'){if(j.user&&j.user.email_confirmed_at===null){st(box,'注册成功，去邮箱点确认链接后再登录');document.getElementById('pass').value='';return}}
  TOKEN=j.access_token;localStorage.setItem('fxbh_tok',TOKEN);show();
}
function hdr(){return{apikey:ANON,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}}
function toggleMode(){mode=mode==='login'?'signup':'login';document.getElementById('modeLink').textContent=mode==='login'?'没有账号？点此注册':'已有账号？去登录';document.getElementById('btn1').textContent=mode==='login'?'登录':'注册'}
async function show(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  const[ok,r,j]=await jr(API+'/status',{method:'POST',headers:hdr(),body:JSON.stringify({jwt:TOKEN})});
  const box=document.getElementById('st2');
  if(!ok||!r.ok){st(box,'状态获取失败：'+(j.detail&&j.detail.detail||j.detail||'网络错误'));return}
  st(box, j.is_vip?'已开通':'待开通', j.is_vip?'ok':'');
  document.getElementById('vip').textContent=j.is_vip?'VIP ✅':'非 VIP';
  document.getElementById('vip').style.color=j.is_vip?'#4ade80':'#f87171';
  document.getElementById('exp').textContent=j.plan_expire_at?new Date(j.plan_expire_at*1000).toLocaleDateString():'永久';
  document.getElementById('mach').textContent=j.machines+' 台';
  const kw=document.getElementById('keyWrap'),pb=document.getElementById('payBtn');
  if(j.is_vip&&j.key){kw.classList.remove('hidden');document.getElementById('key').textContent=j.key;pb.classList.add('hidden');st(box,'已开通：换机请先在软件解绑旧机','ok')}
  else{kw.classList.add('hidden');pb.classList.remove('hidden')}
  ROLE=j.role||'user';
  document.getElementById('admBtn').classList.toggle('hidden',ROLE!=='admin');
}
async function payIntent(){const b=document.getElementById('st2');st(b,'已登记，请联系卖家确认付款…');const[ok,r]=await jr(API+'/pay-intent',{method:'POST',headers:hdr(),body:JSON.stringify({jwt:TOKEN})});st(b,ok&&r.ok?'已提交开通申请，卖家确认后密钥会显示在此':'提交失败，请重试',ok&&r.ok?'ok':'')}
function copyKey(){navigator.clipboard.writeText(document.getElementById('key').textContent);const b=document.getElementById('st2');st(b,'密钥已复制，去软件粘贴激活','ok')}
function logout(){TOKEN='';localStorage.removeItem('fxbh_tok');location.reload()}
let ROLE='user';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function toggleAdm(){const a=document.getElementById('adm');a.classList.toggle('hidden');if(!a.classList.contains('hidden'))await admList()}
async function admList(){
  const[ok,r,j]=await jr(API+'/admin/users',{method:'POST',headers:hdr(),body:JSON.stringify({jwt:TOKEN})});
  const box=document.getElementById('admList');
  if(!ok||!r.ok){box.innerHTML='<p>加载失败</p>';return}
  box.innerHTML='<p style="color:#9299a2;margin:4px 0">买家列表(最近 300)：</p>'+(j.users||[]).map(u=>
    '<div class="urow">'+
    '<div style="display:flex;justify-content:space-between"><b>'+esc(u.email||u.user_id)+'</b><span style="color:#c7f36a">'+esc(u.role)+'</span></div>'+
    '<div style="color:#9299a2;margin:2px 0">到期 '+esc(u.plan_expire_at?new Date(u.plan_expire_at*1000).toLocaleDateString():'永久')+
    ' · 机器 '+u.machines+' · 密钥 …'+esc(u.key_tail||'')+'</div>'+
    '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">'+
    '<select data-uid="'+esc(u.user_id)+'" data-role="1"><option>user</option><option>vip</option><option>admin</option></select>'+
    '<input data-uid="'+esc(u.user_id)+'" data-exp="1" placeholder="到期时间戳(空=永久)" style="width:130px;flex:1;min-width:100px">'+
    '<button onclick="admSave(\''+esc(u.user_id)+'\')">保存</button>'+
    '<button onclick="admKey(\''+esc(u.user_id)+'\')">发钥</button>'+
    '<button onclick="admRevoke(\''+esc(u.user_id)+'\')">吊销</button>'+
    '</div></div>').join('');
  (j.users||[]).forEach(u=>{const s=box.querySelector('select[data-uid="'+esc(u.user_id)+'"]');if(s)s.value=u.role});
}
async function admCall(path,payload){return jr(API+'/admin/'+path,{method:'POST',headers:hdr(),body:JSON.stringify(Object.assign({jwt:TOKEN},payload))})}
async function admSave(uid){const row=document.querySelector('[data-uid="'+esc(uid)+'"][data-role]');const exp=document.querySelector('[data-uid="'+esc(uid)+'"][data-exp]');const role=row?row.value:'user';const expv=parseFloat(exp&&exp.value?exp.value:0);const[ok,r]=await admCall('upsert',{user_id:uid,role:role,plan_expire_at:isNaN(expv)?0:expv});st(document.getElementById('st2'),ok&&r.ok?'已保存':'保存失败',ok&&r.ok?'ok':'');admList()}
async function admKey(uid){const[ok,r,j]=await admCall('issue-key',{user_id:uid});if(ok&&r.ok&&r.key){st(document.getElementById('st2'),'密钥：'+r.key,'ok')}else{st(document.getElementById('st2'),'发钥失败：先设 vip/admin','')}}
async function admRevoke(uid){if(!confirm('吊销该用户密钥并作废其会话？'))return;const[ok,r]=await admCall('revoke-key',{user_id:uid});st(document.getElementById('st2'),ok&&r.ok?'已吊销':'吊销失败',ok&&r.ok?'ok':'');admList()}
if(TOKEN)show();
</script>
